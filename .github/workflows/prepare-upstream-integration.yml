name: Prepare isolated upstream integration candidate
on:
  push:
    branches:
      - integration/upstream-develop-2026-11-18
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-candidate:
    if: github.repository == 'PauloKutscher/TypeR'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge upstream onto fork without touching develop
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'typeR-integration-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          FORK_START="$(git rev-parse HEAD)"
          git fetch --no-tags https://github.com/ScanR/TypeR.git refs/heads/develop
          UPSTREAM_START="$(git rev-parse FETCH_HEAD)"
          printf 'Fork source: %s\nUpstream source: %s\n' "$FORK_START" "$UPSTREAM_START"
          # Prefer fork edits only in truly overlapping hunks. Non-overlapping upstream
          # changes are merged normally, including improvements to existing files.
          git merge -X ours --no-commit --no-ff FETCH_HEAD || true
          mkdir -p docs
          git diff --name-only --diff-filter=U > /tmp/typer-unresolved.txt
          cat /tmp/typer-unresolved.txt
          # Any remaining structural conflicts are explicitly logged and preserve
          # the fork's version; these files still require a human review.
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git ls-files --stage -- "$file" | awk '$3 == 2 {found=1} END {exit !found}'; then
              git checkout --ours -- "$file"
              git add -- "$file"
            else
              git rm -f --ignore-unmatch -- "$file"
            fi
          done < /tmp/typer-unresolved.txt
          # Alignment/Smart Paste algorithms MUST NOT change before a measured
          # A/B comparison with the original fork and real Photoshop PSD pages.
          # This also protects the native CEP/UXP paths that can change results
          # without changing the pure JS positioning algorithm.
          protected=(
            app_src/host.js
            app_src/bubbleGeometry.jsxinc
            app_src/oneClick/alignPlan.js
            app_src/oneClick/geometry.js
            app_src/oneClick/bubblePlan.js
            app_src/oneClick/connected.js
            app_src/oneClick/layout.js
            app_src/oneClick/solver.js
            app_src/oneClick/measureSpec.js
            app_src/oneClick/openBubble.js
            app_src/oneClick/smartPaste.js
            app_src/oneClick/textGraph.js
            app_src/smartPasteClient.js
            uxp-src/host/smartPaste.js
            uxp-src/host/photoshop.js
            scripts/testAlignPlan.js
          )
          for file in "${protected[@]}"; do
            if git cat-file -e "HEAD:$file" 2>/dev/null; then
              git restore --source=HEAD --staged --worktree -- "$file"
            fi
          done
          git add -A
          if git ls-files -u | grep -q .; then
            echo 'Unresolved git index entries remain; refusing to push.'
            exit 1
          fi
          cat > docs/upstream-merge-review-2026-11-18.md <<EOF
          # Upstream integration — review candidate, NOT approved for production

          - Fork baseline: \`$FORK_START\`
          - Upstream ScanR/TypeR develop: \`$UPSTREAM_START\`
          - Destination is an isolated candidate branch; original develop is unchanged.
          - This is an AUTOMATIC THREE-WAY DRAFT. Git's \`-X ours\` chose fork hunks on conflicts.
          - Unresolved structural conflicts preserved the fork's file (see below).
          - Photoshop-facing centering/Smart Paste paths listed below were restored exactly
            from the fork, regardless of non-conflicting upstream edits.
          - DO NOT MERGE until code review, automated checks, and Photoshop benchmarks pass.

          ## Structural conflicts needing review

          EOF
          if [ -s /tmp/typer-unresolved.txt ]; then
            sed 's/^/- /' /tmp/typer-unresolved.txt >> docs/upstream-merge-review-2026-11-18.md
          else
            printf 'None after -X ours (conflicting hunks still require review).\n' >> docs/upstream-merge-review-2026-11-18.md
          fi
          cat >> docs/upstream-merge-review-2026-11-18.md <<'EOF'

          ## Required checks before merge

          1. Inspect `git diff develop...integration/upstream-develop-2026-11-18-candidate`
             including the settings, style import, installer and CEP/UXP service call paths.
          2. Run `npm ci && npm run verify && npm run package:uxp` on Windows.
          3. Run `node scripts/testAlignPlan.js`,
             `node scripts/testSmartPasteEngine.js`,
             `node scripts/testSmartPasteClient.js`,
             `node scripts/testUxpHost.js` and the TextShapeR tests.
          4. In Photoshop on Windows, compare the original fork and the candidate
             on the SAME PSDs with matching text, fonts, padding and settings.
             Cover single/irregular/tail balloons, double/triple bubbles,
             overlapping text, small shapes, rotated layers, style strokes,
             resizing, missing fonts and UXP versus CEP.
          5. To capture real-world centering results, use the existing
             `scripts/lab/runMeasure.ps1` and `scripts/lab/compareRuns.js`
             with identical options (`-Scatter none/mid/full/overlap`,
             `-Padding`, `-WandTolerance` and `-Resize`).
             The existing compareRuns.js requires the SAME experiment population
             and rejects missing cases or regressions.
          6. Do not adopt any upstream/hybrid alignment logic until measured
             improvement without regression is established. If inconclusive,
             retain the fork's algorithm.

          Automated tests and packaging do not replace real Photoshop validation.
          EOF
          printf '\n## Protected implementation files\n' >> docs/upstream-merge-review-2026-11-18.md
          printf -- '- `%s`\n' "${protected[@]}" >> docs/upstream-merge-review-2026-11-18.md
          git add docs/upstream-merge-review-2026-11-18.md
          # Report upstream whitespace/CRLF issues without rewriting existing code.
          git -c core.whitespace=cr-at-eol diff --cached --check > /tmp/typer-whitespace.log 2>&1 || true
          if [ -s /tmp/typer-whitespace.log ]; then
            echo 'Whitespace warnings (existing upstream formatting):'
            tail -35 /tmp/typer-whitespace.log
          fi
          echo 'Staged files:'
          git diff --cached --stat | tail -40
          git commit -m 'WIP: stage upstream develop integration; preserve fork centering for A/B validation'
          git push origin HEAD:refs/heads/integration/upstream-develop-2026-11-18-candidate
      - name: Summarize candidate branch
        run: |
          echo 'Candidate branch: integration/upstream-develop-2026-11-18-candidate'
          echo 'Do not merge without tests and code review.'
